# Every service belongs to a profile, so `docker compose up` on its own starts
# nothing and you always say which stack you want:
#
#   docker compose --profile dev up          backend + postgres + redis
#   docker compose --profile full up         the same, plus the built frontend
#   docker compose --profile test up         API under test + its own database
#   docker compose --profile integration up  local standalone Stellar network
#   docker compose --profile cluster up      6-node Redis Cluster (3 primaries
#                                            + 3 replicas) for BullMQ failover
#
# dev and test use separate databases on separate host ports, so both can run
# at once without colliding.
#
# To run the app against the Redis Cluster instead of the single-instance
# redis service, add the profile and pass the seeds through the host env:
#
#   REDIS_CLUSTER_NODES=redis-cluster-1:6379,redis-cluster-2:6379,... \
#     docker compose --profile dev --profile cluster up
#
# The `mtls` profile is the same dev stack with every internal hop encrypted and
# mutually authenticated (issue #736). pki-init generates the internal CA on
# first boot and the API plus the edge then require a client certificate from
# each other:
#
#   MTLS_ENABLED=true docker compose --profile dev --profile mtls up
#
# Omit MTLS_ENABLED and the same stack runs over plain HTTP, which is why the
# certs are generated but unused until you opt in.

# Internal PKI settings shared by the backend services. The material is split
# across two volumes: `certs` holds the trust bundle plus one keypair per
# service and is mounted read-only everywhere, while `pki-ca` holds the issuer
# keys and is mounted into pki-init only. Leaf keys land mode 600 owned by
# uid 1000, the `node` user in the backend images.
x-mtls-common: &mtls-common
  MTLS_ENABLED: ${MTLS_ENABLED:-false}
  MTLS_CERT_DIR: /app/certs
  MTLS_CA_FILE: /app/certs/ca-bundle.crt
  MTLS_MIN_VERSION: ${MTLS_MIN_VERSION:-TLSv1.2}
  # Only these certificate identities may call the API (comma-separated). The
  # healthcheck identity has to be listed too, or the container probe is
  # rejected by the same policy it is meant to be verifying.
  MTLS_REQUIRED_SANS: ${MTLS_REQUIRED_SANS:-spiffe://stellar-tags/internal/edge,spiffe://stellar-tags/internal/healthcheck}
  MTLS_INTERNAL_DOMAINS: ${MTLS_INTERNAL_DOMAINS:-backend,edge,fraud-worker,api-test,localhost,127.0.0.1}
  MTLS_HOT_RELOAD: ${MTLS_HOT_RELOAD:-true}
  MTLS_RELOAD_INTERVAL_MS: ${MTLS_RELOAD_INTERVAL_MS:-30000}

x-redis-cluster-node: &redis-cluster-node
  image: redis:7-alpine
  profiles: ["cluster"]
  command:
    - redis-server
    - --port
    - "6379"
    - --cluster-enabled
    - "yes"
    - --cluster-config-file
    - /data/nodes.conf
    - --cluster-node-timeout
    - "5000"
    - --appendonly
    - "yes"
  volumes:
    # Anonymous volume: `docker compose --profile cluster down -v` resets the
    # slot map and data so a clean bootstrap is possible.
    - /data
  healthcheck:
    test: ["CMD", "redis-cli", "-p", "6379", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ── dev ────────────────────────────────────────────────────────────────────
  postgres:
    profiles: ["dev", "full", "mtls"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_tags
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    profiles: ["dev", "full", "mtls"]
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── internal PKI (#736) ───────────────────────────────────────────────────
  # One-shot: builds the internal root CA, the issuing CA and a certificate per
  # service, then exits. Issuer material stays in the `pki-ca` volume, which is
  # mounted here and nowhere else, so a compromised service cannot mint itself a
  # certificate. Only the trust bundle and the per-service keypairs are exported
  # to the `certs` volume that every service reads. The step is idempotent, so a
  # re-run reuses the existing CA; see docs/mtls.md for rotation.
  pki-init:
    profiles: ["mtls"]
    image: alpine/openssl:1.1.1a
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - >
        /pki/pki.sh init --out /ca --days ${PKI_LEAF_DAYS:-397} &&
        /export.sh
    volumes:
      - ./stellar-payment-platform/scripts/pki/pki.sh:/pki/pki.sh:ro
      - ./stellar-payment-platform/scripts/pki/export-runtime-material.sh:/export.sh:ro
      - pki-ca:/ca
      - certs:/certs
    restart: "no"

  backend:
    profiles: ["dev", "full", "mtls"]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "5000:5000"
    environment:
      <<: *mtls-common
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stellar_tags?schema=public
      REDIS_URL: redis://redis:6379
      # Leave blank to keep using the single-instance REDIS_URL above. Set it to
      # the cluster seeds (comma-separated) to switch BullMQ to cluster mode.
      REDIS_CLUSTER_NODES: ${REDIS_CLUSTER_NODES:-}
      PORT: "5000"
      LOG_DIR: /app/logs
      # This service's own identity: presented to peers as a client and used to
      # serve the API. Generated by pki-init.
      MTLS_CERT_FILE: /app/certs/services/api.crt
      MTLS_KEY_FILE: /app/certs/services/api.key
    volumes:
      # Keep rotated logs across container restarts. The transports cap the
      # volume's growth by rotating daily / at 20MB and pruning old archives.
      - backendlogs:/app/logs
      # Internal PKI, read-only: the API never needs to write certificates.
      - certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
        required: false

  fraud-worker:
    profiles: ["dev", "full", "mtls"]
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    command: ["node", "fraud-worker.js"]
    environment:
      <<: *mtls-common
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stellar_tags?schema=public
      REDIS_URL: redis://redis:6379
      FRAUD_CONSUMER_GROUP: fraud-detectors
      # The worker makes no inbound calls, but it does call internal services,
      # so it needs a client identity of its own.
      MTLS_CERT_FILE: /app/certs/services/fraud-worker.crt
      MTLS_KEY_FILE: /app/certs/services/fraud-worker.key
    volumes:
      - certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
        required: false

  # ── edge ───────────────────────────────────────────────────────────────────
  # Public edge for the dev/full stacks: serves the dashboard and proxies
  # /api/ to the backend over plain HTTP. `edge-mtls` is the same thing with an
  # authenticated, encrypted hop to the API.
  edge:
    profiles: ["mtls"]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-mtls
    ports:
      - "3000:80"
    environment:
      MTLS_CA_BUNDLE: ca-bundle.crt
      MTLS_EDGE_CERT: services/edge.crt
      MTLS_EDGE_KEY: services/edge.key
      MTLS_BACKEND_NAME: backend
      MTLS_BACKEND_PORT: "5000"
    volumes:
      - certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_started
      pki-init:
        condition: service_completed_successfully
        required: false

  # Only in full, not dev: the Vite build is the slowest thing here and backend
  # work does not need it. full is dev plus this.
  frontend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_BASE: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ── redis cluster ──────────────────────────────────────────────────────────
  # Six-node Redis Cluster (3 primaries + 3 replicas) for exercising BullMQ
  # sharding and node failover locally. redis-cluster-init bootstraps it once
  # every node answers PING, then exits:
  #
  #   docker compose --profile cluster up -d
  #
  # Clients must live on this compose network: cluster redirects advertise
  # container IPs, so the host-published ports below are for troubleshooting
  # only. The backend joins this network under the dev profile.
  redis-cluster-1:
    <<: *redis-cluster-node
    ports:
      - "7001:6379"
  redis-cluster-2:
    <<: *redis-cluster-node
    ports:
      - "7002:6379"
  redis-cluster-3:
    <<: *redis-cluster-node
    ports:
      - "7003:6379"
  redis-cluster-4:
    <<: *redis-cluster-node
    ports:
      - "7004:6379"
  redis-cluster-5:
    <<: *redis-cluster-node
    ports:
      - "7005:6379"
  redis-cluster-6:
    <<: *redis-cluster-node
    ports:
      - "7006:6379"

  redis-cluster-init:
    profiles: ["cluster"]
    image: redis:7-alpine
    depends_on:
      redis-cluster-1:
        condition: service_healthy
      redis-cluster-2:
        condition: service_healthy
      redis-cluster-3:
        condition: service_healthy
      redis-cluster-4:
        condition: service_healthy
      redis-cluster-5:
        condition: service_healthy
      redis-cluster-6:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        redis-cli --cluster create
        redis-cluster-1:6379 redis-cluster-2:6379 redis-cluster-3:6379 redis-cluster-4:6379 redis-cluster-5:6379 redis-cluster-6:6379
        --cluster-replicas 1 --cluster-yes

  # ── test ───────────────────────────────────────────────────────────────────
  postgres-test:
    profiles: ["test"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stellar_tags_test
    # 5433 on the host so a dev postgres can stay up on 5432.
    ports:
      - "5433:5432"
    # No volume: a test database should start empty every time.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  api-test:
    profiles: ["test"]
    build:
      context: ./stellar-payment-platform
      dockerfile: Dockerfile.test
    environment:
      <<: *mtls-common
      PORT: "5001"
      DATABASE_URL: postgresql://postgres:postgres@postgres-test:5432/stellar_tags_test?schema=public
      MTLS_CERT_FILE: /app/certs/services/api-test.crt
      MTLS_KEY_FILE: /app/certs/services/api-test.key
    ports:
      - "5001:5001"
    volumes:
      - certs:/app/certs:ro
    depends_on:
      postgres-test:
        condition: service_healthy
      pki-init:
        condition: service_completed_successfully
        required: false
    # The probe follows the server onto https when mTLS is on; a plain wget
    # would only ever be able to test the plaintext path (#736).
    healthcheck:
      test: ["CMD", "node", "scripts/healthcheck.js"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  # ── integration ────────────────────────────────────────────────────────────
  # Standalone Stellar network (Soroban-enabled) used by the contract
  # integration tests. Exposes both the Horizon REST API (8000) and the
  # Soroban RPC endpoint (8000/rpc) so the Rust SDK can submit real
  # transactions against a local network. Kept out of the test profile
  # because it pulls a multi-gigabyte image the API tests never touch.
  stellar-standalone:
    profiles: ["integration"]
    image: stellar/quickstart:latest
    command: [
      "--standalone",
      "--enable-soroban-rpc",
      "--enable-core-artifacts",
      "--local",
    ]
    environment:
      ENABLE_LOGS: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  pgdata:
  backendlogs:
  # Internal PKI, split so a service can read its own certificate but never the
  # CA private keys.
  #   certs  - trust bundle, manifest and one keypair per service. Written by
  #            pki-init, mounted read-only everywhere else.
  #   pki-ca - root and issuing CA keypairs. Mounted into pki-init only, so
  #            signing material never reaches a running service.
  certs:
  pki-ca:

