# nginx configuration for the mTLS stack (#736).
#
# The public edge keeps serving the dashboard over plain HTTP on :80 — that hop
# terminates at the outermost proxy in a real deployment — but every request it
# forwards to the API now travels over an authenticated, encrypted channel. The
# edge presents its own client certificate and refuses to proxy unless the API
# proves it holds a certificate signed by the internal CA.
#
# Copied into /etc/nginx/templates/ so the official nginx image substitutes the
# ${...} placeholders from the environment at container start. Only variables
# that actually exist in the environment are substituted, so nginx's own
# runtime variables ($host, $uri, ...) pass through untouched.

server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass https://${MTLS_BACKEND_NAME}:${MTLS_BACKEND_PORT}/;

        # Client identity presented to the API. This is what makes the API's
        # "a valid client certificate is required" check pass.
        proxy_ssl_certificate     /etc/nginx/certs/${MTLS_EDGE_CERT};
        proxy_ssl_certificate_key /etc/nginx/certs/${MTLS_EDGE_KEY};

        # Server verification: the API must present a certificate chaining to
        # the internal CA whose name matches proxy_ssl_name. Without this nginx
        # would happily proxy to anything that answered on that port.
        proxy_ssl_trusted_certificate /etc/nginx/certs/${MTLS_CA_BUNDLE};
        proxy_ssl_verify             on;
        proxy_ssl_verify_depth       2;
        proxy_ssl_name               ${MTLS_BACKEND_NAME};
        proxy_ssl_protocols          TLSv1.2 TLSv1.3;
        proxy_ssl_session_cache      shared:MTLS:1m;
        proxy_ssl_session_timeout    10m;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
